[project]
name = "cloudflow"
version = "1.6.0b0"
description = "Workflows for cloud based numerical weather prediction"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "RPS North America" }]
# The lower bounds are the versions in requirements/python_minimal_requirements.txt.
dependencies = [
    "boto3>=1.40.22",
    "botocore>=1.40.22",
    "dask>=2026.1.0",
    "distributed",
    "prefect>=3.6.29",
    # cloudflow.plotting, which workflows/job_tasks.py imports when it is loaded.
    "matplotlib>=3.10.6",
    "netCDF4>=1.7.2",
    "numpy>=2.3.2",
    "pillow>=12.2.0",
    "pyproj>=3.7.2",
]

[project.optional-dependencies]
# dask-ssh, which the cluster tasks start, needs paramiko.
ssh = ["paramiko"]
# cloudflow/workflows/python_examples.py
examples = ["numpy", "pandas", "s3fs", "xarray"]
# cloudflow/utils/notebook.py
notebook = ["ipykernel", "nbconvert", "nbformat", "notebook", "requests"]
# What cloudflow/plotting/hlfs.py imports when it is run as a script.
hlfs = ["cartopy", "cmocean", "pandas", "scipy", "xarray"]

[project.scripts]
cloudflow = "cloudflow.workflows.workflow_main:main"

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]
# docs/sphinx/: the API documentation, built by `just docs` (stage 8).
docs = ["recommonmark", "sphinx", "sphinx-rtd-theme"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudflow"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PL", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.pyright]
include = ["tests"]
extraPaths = ["tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: builds and installs the wheels, or builds the documentation; run by full-test only"]
